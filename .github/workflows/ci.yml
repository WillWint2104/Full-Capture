# Checks every pull request (and main) with the project's own commands:
# the committed full-capture.html matches its source, the page contract,
# unit tests, and the browser tests (Chromium with fake camera, mic and screen;
# one test captures a real screen, on a virtual display). Saved recordings are
# checked with ffmpeg and with GStreamer, a player stack independent of ffmpeg.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Before the checks: the page contract check opens the page in Chromium too.
      - name: Install Chromium, ffmpeg, GStreamer and a virtual display
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav \
            python3-gi python3-gst-1.0 gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0

      - name: Build (the committed full-capture.html must match src/)
        run: |
          npm run build
          git diff --exit-code -- full-capture.html

      - name: Page contract
        run: node scripts/check-contract.mjs

      - name: Unit tests
        run: npm test

      - name: Browser tests
        run: xvfb-run -a npx playwright test --reporter=line

      - name: Keep the test results when something fails
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: test-results/
          retention-days: 7
